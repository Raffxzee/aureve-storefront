services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      SEED_DEV_ADMIN: "false"
      API_PORT: "3001"
      DATABASE_PATH: /app/data/aureve.sqlite
      BACKUP_DIRECTORY: /app/backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ORDER_RESERVATION_MINUTES: ${ORDER_RESERVATION_MINUTES:-45}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - aureve_data:/app/data
      - aureve_backups:/app/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  aureve_data:
  aureve_backups: